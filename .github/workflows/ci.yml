name: CI

on:
  push:
    branches:
      - Nour

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker setup
        run: |
          ls -la
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile missing!"
            exit 1
          fi

      - name: Set environment variables
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Matching your local Node version

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile  # Explicit Dockerfile path
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backendproject:latest
            ${{ secrets.DOCKER_USERNAME }}/backendproject:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
