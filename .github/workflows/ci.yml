name: CI Pipeline

on:
  push:
    branches:
      - Nour # Optional: you can specify which branch to trigger the pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (modify if using another language)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies (including development dependencies)
      - name: Install Dependencies
        run: npm ci  # Use `npm ci` for a clean and faster install in CI environments

      # Step 4: Run Tests
      - name: Run Tests
        run: npm test
        env:
          CI: true  # Ensures Jest runs in CI mode (e.g., disabling interactive prompts)

      # Step 5: Lint Code (ensure linting tools are properly configured)
      - name: Lint Code
        run: npm run lint

      # Step 6: Optionally, add a step to upload test results or code coverage (e.g., with Coveralls or Codecov)
